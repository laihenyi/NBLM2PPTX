[package]
name = "n2p-image"
description = "邊緣色彩統計與去水印修補（取代 numpy/scipy 實作）"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
n2p-core = { path = "../n2p-core" }
serde.workspace = true
# LaMa 推論用。`download-binaries` 會在編譯期抓官方預編譯的 ONNX Runtime
# （各平台各一份，約 30–60 MB），執行期完全離線。`coreml` 讓 macOS 能把 LaMa 放到 GPU。
ort = { version = "=2.0.0-rc.15", features = ["download-binaries", "coreml"] }
# 讀寫 ONNX 模型（GPU 路徑要改寫模型圖）。版本須與 src/onnx_pb/onnx.rs 的產生器一致。
protobuf = "=3.7.2"

[dev-dependencies]
serde_json.workspace = true
n2p-core = { path = "../n2p-core" }
