<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    NBLM2PPTX 圖示：後方斜放的 PDF 頁面，前方是文字框可編輯的投影片。
    依 macOS 圖示格線：1024 畫布、824 圓角方塊（x/y 100）。
    重新產生 AppIcon.icns：./scripts/make-icon.sh
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D7BFF"/>
      <stop offset="1" stop-color="#1A3A9C"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B1B4D" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- 底板 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#tile-shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <g clip-path="url(#tile)">
    <g transform="translate(-12 40)">
      <!-- PDF 頁面：靜態、不可編輯 -->
      <g transform="rotate(-9 380 400)" filter="url(#card-shadow)">
        <path d="M210 175 H480 L560 255 V625 Q560 640 545 640 H225 Q210 640 210 625 Z" fill="#E8EDF7"/>
        <path d="M480 175 V240 Q480 255 495 255 H560 Z" fill="#C3CDE0"/>
        <rect x="250" y="300" width="250" height="20" rx="10" fill="#B4C0D6"/>
        <rect x="250" y="345" width="270" height="20" rx="10" fill="#B4C0D6"/>
        <rect x="250" y="390" width="210" height="20" rx="10" fill="#B4C0D6"/>
        <rect x="250" y="435" width="250" height="20" rx="10" fill="#B4C0D6"/>
        <rect x="236" y="205" width="132" height="62" rx="14" fill="#E5484D"/>
        <text x="302" y="250" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
              font-weight="700" font-size="44" fill="#FFFFFF">PDF</text>
      </g>

      <!-- 投影片：文字變成可編輯的文字框 -->
      <g filter="url(#card-shadow)">
        <rect x="300" y="455" width="560" height="315" rx="30" fill="#FFFFFF"/>
      </g>
      <!-- 圖片留在原位 -->
      <rect x="690" y="500" width="130" height="130" rx="20" fill="#FF9F1C"/>
      <circle cx="790" cy="532" r="14" fill="#FFF3D6"/>
      <path d="M702 618 L742 566 L770 598 L788 578 L810 618 Z" fill="#FFF3D6"/>
      <!-- 內文 -->
      <rect x="345" y="622" width="300" height="20" rx="10" fill="#A9B6CC"/>
      <rect x="345" y="660" width="250" height="20" rx="10" fill="#A9B6CC"/>
      <rect x="345" y="698" width="460" height="20" rx="10" fill="#A9B6CC"/>
      <!-- 選取中的標題文字框 -->
      <rect x="330" y="490" width="330" height="96" fill="none" stroke="#2F6BFF" stroke-width="6"
            stroke-dasharray="16 10"/>
      <rect x="356" y="519" width="214" height="38" rx="12" fill="#1F2A44"/>
      <rect x="586" y="508" width="9" height="60" rx="4.5" fill="#2F6BFF"/>
      <g fill="#FFFFFF" stroke="#2F6BFF" stroke-width="5">
        <rect x="318" y="478" width="24" height="24" rx="5"/>
        <rect x="648" y="478" width="24" height="24" rx="5"/>
        <rect x="318" y="574" width="24" height="24" rx="5"/>
        <rect x="648" y="574" width="24" height="24" rx="5"/>
      </g>
    </g>
  </g>
</svg>
